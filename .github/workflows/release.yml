name: Release Build

# 正式版 x.y.z：手动触发 + 排班硬门禁，服务端执行，不可绕过。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '目标正式版 x.y.z（无 -rc 后缀）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 排班门禁校验
        run: python3 scripts/check_schedule.py --version "${{ inputs.version }}" --schedule release/schedule.yaml

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建正式版（去 rc 后缀）
        run: ./gradlew assembleRelease -PreleaseVersion="${{ inputs.version }}"

      - name: versionCode +1
        run: python3 scripts/bump_versioncode.py

      - name: 提交 versionCode 递增
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add release/versioncode.txt
          git commit -m "chore: bump versionCode after release ${{ inputs.version }}" || echo "no changes"
          git push

      - name: 上传正式版产物
        uses: actions/upload-artifact@v4
        with:
          name: minimide-release-${{ inputs.version }}
          path: app/build/outputs/apk/release/*.apk
