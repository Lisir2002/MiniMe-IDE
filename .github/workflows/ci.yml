name: CI - Full Verify

# 云端全量验证：所有 push / PR 均触发。
# 本地只跑单测；全量测试（所有模块 test + lint + 全模块 assemble）在此唯一执行。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verify:
    name: 全量测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 结构化日志 - 开始
        run: echo "[$(date -u +%Y-%m-%dT%H:%M:%S+00:00)] [INFO   ] [ci      ] CI 全量验证开始 ref=${{ github.ref }}"

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 单元测试（全模块）
        run: ./gradlew test --no-daemon --stacktrace

      - name: 架构铁律校验
        run: ./gradlew checkModuleRules --no-daemon

      - name: 全量构建（所有模块 assembleDebug）
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn

      - name: 结构化日志 - 完成
        if: success()
        run: echo "[$(date -u +%Y-%m-%dT%H:%M:%S+00:00)] [INFO   ] [ci      ] CI 全量验证通过 sha=${{ github.sha }}"
