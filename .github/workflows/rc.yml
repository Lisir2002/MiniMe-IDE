name: RC Build

# 测试版 x.y.z-rcN：tag 触发，自由发布，无排班门禁。
# 全量测试与构建在云端执行（本地不做）。
on:
  push:
    tags:
      - "v*-rc*"

jobs:
  build-rc:
    name: 测试版全量构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 结构化日志 - 开始
        run: echo "[$(date -u +%Y-%m-%dT%H:%M:%S+00:00)] [INFO   ] [ci      ] RC 构建开始 tag=${{ github.ref_name }}"

      - name: 校验 CHANGELOG 含该版本
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          if grep -q "\[$V\]" CHANGELOG.md; then
            echo "[INFO   ] [ci      ] CHANGELOG 含版本条目 version=$V"
          else
            echo "[ERROR  ] [ci      ] CHANGELOG 缺少版本条目 version=$V"
            exit 1
          fi

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 全量单元测试
        run: ./gradlew test --no-daemon --stacktrace

      - name: 架构铁律校验
        run: ./gradlew checkModuleRules --no-daemon

      - name: 构建 RC 产物
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 RC 产物
        uses: actions/upload-artifact@v4
        with:
          name: minimide-rc-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk

      - name: 结构化日志 - 完成
        if: success()
        run: echo "[$(date -u +%Y-%m-%dT%H:%M:%S+00:00)] [INFO   ] [ci      ] RC 构建完成 tag=${{ github.ref_name }}"
